<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 350" width="940" height="350" role="img" aria-label="ConfidenceOS live sensor trust dashboard">
<defs>
  <linearGradient id="cPanel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#0a1a1c"/>
  </linearGradient>
  <linearGradient id="cArc" gradientUnits="userSpaceOnUse" x1="68" y1="0" x2="252" y2="0">
    <stop offset="0" stop-color="#F87171"/><stop offset="0.45" stop-color="#FBBF24"/><stop offset="1" stop-color="#22D3A6"/>
  </linearGradient>
  <linearGradient id="cBar" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00E5FF"/><stop offset="1" stop-color="#22D3A6"/>
  </linearGradient>
  <filter id="cGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .mono { font-family: ui-monospace, 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace; }
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
  </style>

  <path id="sp1" d="M0 26 L26 20 L52 24 L78 12 L104 17 L130 8 L156 14 L182 6 L208 11 L234 5" />
  <path id="sp2" d="M0 14 L26 18 L52 11 L78 20 L104 13 L130 22 L156 12 L182 19 L208 10 L234 16" />
  <path id="sp3" d="M0 10 L26 13 L52 9 L78 24 L104 30 L130 21 L156 27 L182 18 L208 23 L234 20" />
</defs>

<rect x="1" y="1" width="938" height="348" rx="16" fill="url(#cPanel)" stroke="#1e3350"/>

<!-- header -->
<text class="sans" x="26" y="34" font-size="17" font-weight="700" fill="#E6EDF3">ConfidenceOS</text>
<text class="mono" x="144" y="34" font-size="12" fill="#5C7A99">/ industrial HMI trust layer</text>
<g transform="translate(806 22)">
  <rect width="112" height="22" rx="11" fill="#0c1a17" stroke="#22D3A6" stroke-opacity="0.45"/>
  <circle cx="14" cy="11" r="3.6" fill="#22D3A6">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text class="mono" x="26" y="15" font-size="10.5" fill="#8CE8CF" letter-spacing="1.2">LIVE STREAM</text>
</g>
<line x1="20" y1="50" x2="920" y2="50" stroke="#1b2a3e"/>

<!-- ══════ GAUGE ══════ -->
<g transform="translate(0 12)">
  <path d="M68 230 A92 92 0 0 1 252 230" fill="none" stroke="#16273c" stroke-width="18" stroke-linecap="round"/>
  <path d="M68 230 A92 92 0 0 1 252 230" fill="none" stroke="url(#cArc)" stroke-width="18" stroke-linecap="round"
        filter="url(#cGlow)" stroke-dasharray="289" stroke-dashoffset="289">
    <animate attributeName="stroke-dashoffset" from="289" to="12" begin="0.3s" dur="2.4s"
             calcMode="spline" keySplines="0.2 0.8 0.2 1" fill="freeze"/>
  </path>

  <g stroke="#2c4a68" stroke-width="2">
    <line x1="68"  y1="230" x2="56"  y2="230"/>
    <line x1="160" y1="138" x2="160" y2="126"/>
    <line x1="252" y1="230" x2="264" y2="230"/>
  </g>
  <text class="mono" x="50" y="256" font-size="10" fill="#41556d" text-anchor="middle">0</text>
  <text class="mono" x="160" y="120" font-size="10" fill="#41556d" text-anchor="middle">50</text>
  <text class="mono" x="268" y="256" font-size="10" fill="#41556d" text-anchor="middle">100</text>

  <g class="sans" font-size="46" font-weight="800" text-anchor="middle" fill="#22D3A6">
    <text x="160" y="222" opacity="0"><animate attributeName="opacity" values="0;1;1;0" dur="0.30s" begin="0.35s"/>12</text>
    <text x="160" y="222" opacity="0"><animate attributeName="opacity" values="0;1;1;0" dur="0.30s" begin="0.65s"/>29</text>
    <text x="160" y="222" opacity="0"><animate attributeName="opacity" values="0;1;1;0" dur="0.30s" begin="0.95s"/>47</text>
    <text x="160" y="222" opacity="0"><animate attributeName="opacity" values="0;1;1;0" dur="0.30s" begin="1.25s"/>63</text>
    <text x="160" y="222" opacity="0"><animate attributeName="opacity" values="0;1;1;0" dur="0.30s" begin="1.55s"/>78</text>
    <text x="160" y="222" opacity="0"><animate attributeName="opacity" values="0;1;1;0" dur="0.30s" begin="1.85s"/>88</text>
    <text x="160" y="222" opacity="0"><animate attributeName="opacity" values="0;1;1;0" dur="0.30s" begin="2.15s"/>93</text>
    <text x="160" y="222" opacity="0" filter="url(#cGlow)"><animate attributeName="opacity" values="0;1" dur="0.35s" begin="2.45s" fill="freeze"/>96<tspan font-size="22" fill="#8CE8CF">%</tspan></text>
  </g>
  <text class="mono" x="160" y="250" font-size="10.5" fill="#5C7A99" text-anchor="middle" letter-spacing="2.6">TRUST SCORE</text>
  <text class="mono" x="160" y="278" font-size="8.4" fill="#41556d" text-anchor="middle">calibration age &#183; stability &#183; cross-check &#183; plausibility</text>
</g>

<line x1="300" y1="70" x2="300" y2="300" stroke="#1b2a3e"/>

<!-- ══════ SENSOR ROWS ══════ -->
<g transform="translate(322 0)">
  <text class="mono" x="0"   y="82" font-size="9.5" fill="#41556d" letter-spacing="1.8">SENSOR</text>
  <text class="mono" x="140" y="82" font-size="9.5" fill="#41556d" letter-spacing="1.8">LAST 60s</text>
  <text class="mono" x="400" y="82" font-size="9.5" fill="#41556d" letter-spacing="1.8">STATE</text>

  <!-- row 1 -->
  <g transform="translate(0 96)">
    <text class="mono" x="0" y="16" font-size="12" fill="#D6E4F0">FT-101</text>
    <text class="mono" x="0" y="30" font-size="9.5" fill="#41556d">flow</text>
    <g transform="translate(140 0)">
      <use href="#sp1" fill="none" stroke="#22D3A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
           stroke-dasharray="300" stroke-dashoffset="300">
        <animate attributeName="stroke-dashoffset" from="300" to="0" begin="0.6s" dur="1.7s" fill="freeze"/>
      </use>
      <circle r="3.2" fill="#22D3A6" filter="url(#cGlow)">
        <animateMotion dur="4.5s" begin="2.3s" repeatCount="indefinite"><mpath href="#sp1"/></animateMotion>
      </circle>
    </g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.4s" fill="freeze"/>
      <rect x="398" y="2" width="96" height="24" rx="12" fill="#0c1a17" stroke="#22D3A6" stroke-opacity="0.5"/>
      <text class="mono" x="446" y="18" font-size="10.5" fill="#22D3A6" text-anchor="middle">TRUSTED</text>
    </g>
  </g>

  <!-- row 2 -->
  <g transform="translate(0 154)">
    <text class="mono" x="0" y="16" font-size="12" fill="#D6E4F0">PT-204</text>
    <text class="mono" x="0" y="30" font-size="9.5" fill="#41556d">pressure</text>
    <g transform="translate(140 0)">
      <use href="#sp2" fill="none" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
           stroke-dasharray="300" stroke-dashoffset="300">
        <animate attributeName="stroke-dashoffset" from="300" to="0" begin="0.9s" dur="1.7s" fill="freeze"/>
      </use>
      <circle r="3.2" fill="#FBBF24" filter="url(#cGlow)">
        <animateMotion dur="4.5s" begin="2.6s" repeatCount="indefinite"><mpath href="#sp2"/></animateMotion>
      </circle>
    </g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.6s" fill="freeze"/>
      <rect x="398" y="2" width="96" height="24" rx="12" fill="#1c160a" stroke="#FBBF24" stroke-opacity="0.5"/>
      <text class="mono" x="446" y="18" font-size="10.5" fill="#FBBF24" text-anchor="middle">DRIFTING</text>
    </g>
  </g>

  <!-- row 3 -->
  <g transform="translate(0 212)">
    <text class="mono" x="0" y="16" font-size="12" fill="#D6E4F0">LT-317</text>
    <text class="mono" x="0" y="30" font-size="9.5" fill="#41556d">level</text>
    <g transform="translate(140 0)">
      <use href="#sp3" fill="none" stroke="#F87171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
           stroke-dasharray="300" stroke-dashoffset="300">
        <animate attributeName="stroke-dashoffset" from="300" to="0" begin="1.2s" dur="1.7s" fill="freeze"/>
      </use>
      <circle r="3.2" fill="#F87171" filter="url(#cGlow)">
        <animateMotion dur="4.5s" begin="2.9s" repeatCount="indefinite"><mpath href="#sp3"/></animateMotion>
      </circle>
    </g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.8s" fill="freeze"/>
      <rect x="398" y="2" width="96" height="24" rx="12" fill="#1e1113" stroke="#F87171" stroke-opacity="0.55"/>
      <text class="mono" x="446" y="18" font-size="10.5" fill="#F87171" text-anchor="middle">SUSPECT</text>
      <circle cx="410" cy="14" r="3" fill="#F87171">
        <animate attributeName="opacity" values="1;0.15;1" dur="1.1s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</g>

<!-- ══════ MASS BALANCE ══════ -->
<line x1="20" y1="306" x2="920" y2="306" stroke="#1b2a3e"/>
<text class="mono" x="26" y="332" font-size="11" fill="#5C7A99" letter-spacing="1.6">MASS BALANCE CROSS-CHECK</text>
<rect x="250" y="322" width="380" height="8" rx="4" fill="#16273c"/>
<rect x="250" y="322" height="8" rx="4" fill="url(#cBar)" width="0">
  <animate attributeName="width" from="0" to="352" begin="3s" dur="1.3s" fill="freeze"/>
</rect>
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="4.3s" fill="freeze"/>
  <text class="mono" x="648" y="332" font-size="11" fill="#22D3A6">conservation holds &#183; 0.4% residual</text>
  <text class="mono" x="892" y="332" font-size="13" fill="#22D3A6" text-anchor="end">&#10003;</text>
</g>
</svg>
