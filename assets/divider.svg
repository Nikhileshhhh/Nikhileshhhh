<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 20" width="1200" height="20" role="img" aria-label="">
<defs>
  <linearGradient id="dBase" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#2c4a68" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="dPulse" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#7DD3FC"/>
    <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
  </linearGradient>
  <filter id="dGlow" x="-50%" y="-400%" width="200%" height="900%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect x="0" y="9" width="1200" height="1.4" fill="url(#dBase)"/>
<rect y="8" width="260" height="3" rx="1.5" fill="url(#dPulse)" filter="url(#dGlow)">
  <animate attributeName="x" from="-260" to="1200" dur="4.5s" repeatCount="indefinite"/>
</rect>
<g fill="#00E5FF">
  <circle cx="576" cy="10" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="600" cy="10" r="2.6"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="624" cy="10" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="0.5s" repeatCount="indefinite"/></circle>
</g>
</svg>
