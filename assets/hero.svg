<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Nikhilesh Kamalapurkar — AI Developer and Full-Stack Engineer">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070b12"/>
    <stop offset="0.55" stop-color="#0b1220"/>
    <stop offset="1" stop-color="#0e1a2e"/>
  </linearGradient>

  <radialGradient id="blobA" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#00E5FF" stop-opacity="0.50"/>
    <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="blobB" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#A855F7" stop-opacity="0.45"/>
    <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="blobC" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#22D3A6" stop-opacity="0.38"/>
    <stop offset="1" stop-color="#22D3A6" stop-opacity="0"/>
  </radialGradient>

  <linearGradient id="nameGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="520" y2="0" spreadMethod="reflect">
    <stop offset="0"    stop-color="#00E5FF"/>
    <stop offset="0.35" stop-color="#7DD3FC"/>
    <stop offset="0.62" stop-color="#A855F7"/>
    <stop offset="1"    stop-color="#22D3A6"/>
    <animateTransform attributeName="gradientTransform" type="translate"
                      from="-520 0" to="0 0" dur="5s" repeatCount="indefinite"/>
  </linearGradient>

  <linearGradient id="rule" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="960" y2="0">
    <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
    <stop offset="0.15" stop-color="#00E5FF"/>
    <stop offset="0.6" stop-color="#A855F7"/>
    <stop offset="1" stop-color="#22D3A6" stop-opacity="0.1"/>
  </linearGradient>

  <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#9BE7FF" stop-opacity="0.14"/>
    <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
  </linearGradient>

  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0 L0 0 0 40" fill="none" stroke="#1b2a3e" stroke-width="1" opacity="0.55"/>
  </pattern>

  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="42"/>
  </filter>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <clipPath id="frame"><rect x="0" y="0" width="1200" height="320" rx="18"/></clipPath>

  <style>
    .mono { font-family: ui-monospace, 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .role { opacity: 0; animation: roll 16s ease-in-out infinite; }
    .r1 { animation-delay: 0s }  .r2 { animation-delay: 4s }
    .r3 { animation-delay: 8s }  .r4 { animation-delay: 12s }
    @keyframes roll {
      0%   { opacity: 0; transform: translateY(10px); }
      3%   { opacity: 1; transform: translateY(0); }
      22%  { opacity: 1; transform: translateY(0); }
      25%  { opacity: 0; transform: translateY(-10px); }
      100% { opacity: 0; transform: translateY(-10px); }
    }
    .tw { animation: tw 3.2s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: .12 } 50% { opacity: .85 } }
  </style>
</defs>

<g clip-path="url(#frame)">
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <g filter="url(#soft)">
    <circle cx="180" cy="90" r="150" fill="url(#blobA)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 90 40; -30 60; 0 0" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="240" r="170" fill="url(#blobB)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; -110 -50; 40 -80; 0 0" dur="22s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="30" r="130" fill="url(#blobC)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 60 70; -70 30; 0 0" dur="26s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g fill="#CFF6FF">
    <circle class="tw" cx="120" cy="250" r="1.6"/>
    <circle class="tw" cx="300" cy="60"  r="1.3" style="animation-delay:.6s"/>
    <circle class="tw" cx="440" cy="270" r="1.8" style="animation-delay:1.1s"/>
    <circle class="tw" cx="700" cy="120" r="1.4" style="animation-delay:1.7s"/>
    <circle class="tw" cx="860" cy="70"  r="1.6" style="animation-delay:2.2s"/>
    <circle class="tw" cx="1040" cy="180" r="1.3" style="animation-delay:.9s"/>
    <circle class="tw" cx="1130" cy="60" r="1.7" style="animation-delay:2.6s"/>
    <circle class="tw" cx="60"  cy="140" r="1.4" style="animation-delay:1.4s"/>
    <circle class="tw" cx="530" cy="35"  r="1.2" style="animation-delay:2.9s"/>
    <circle class="tw" cx="780" cy="290" r="1.5" style="animation-delay:.3s"/>
  </g>

  <rect x="0" y="-40" width="1200" height="40" fill="url(#scan)">
    <animate attributeName="y" from="-40" to="320" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- status chip -->
  <g transform="translate(940 42)">
    <rect x="0" y="0" width="216" height="34" rx="17" fill="#0c1a17" stroke="#22D3A6" stroke-opacity="0.5"/>
    <circle cx="20" cy="17" r="4.5" fill="#22D3A6">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="17" r="4.5" fill="none" stroke="#22D3A6">
      <animate attributeName="r" values="4.5;12" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text class="mono" x="36" y="22" font-size="12.5" fill="#8CE8CF" letter-spacing="1.4">OPEN TO OPPORTUNITIES</text>
  </g>

  <!-- kicker -->
  <text class="mono" x="60" y="88" font-size="14" fill="#5C7A99" letter-spacing="4.5">HYDERABAD, INDIA</text>

  <!-- name -->
  <text class="sans" x="58" y="164" font-size="62" font-weight="800" letter-spacing="1"
        fill="url(#nameGrad)" filter="url(#glow)">NIKHILESH KAMALAPURKAR</text>

  <!-- animated rule -->
  <rect x="60" y="184" height="3" rx="1.5" fill="url(#rule)">
    <animate attributeName="width" from="0" to="900" dur="1.6s" fill="freeze"/>
  </rect>

  <!-- rotating roles -->
  <g transform="translate(60 232)">
    <text class="mono" x="0" y="0" font-size="18" fill="#22D3A6">&#8250;</text>
    <g transform="translate(22 0)">
      <text class="mono role r1" x="0" y="0" font-size="17" fill="#D6E4F0">AI Developer Intern <tspan fill="#5C7A99">@</tspan> <tspan fill="#00E5FF">ABB Global Industries</tspan></text>
      <text class="mono role r2" x="0" y="0" font-size="17" fill="#D6E4F0"><tspan fill="#FBBF24">1st Place</tspan> &#8212; ABB Accelerator National Hackathon <tspan fill="#5C7A99">/ 1,400+ teams</tspan></text>
      <text class="mono role r3" x="0" y="0" font-size="17" fill="#D6E4F0">Founder <tspan fill="#5C7A99">@</tspan> <tspan fill="#A855F7">RankShala</tspan> &#8212; 200+ users in 2 weeks, zero ad spend</text>
      <text class="mono role r4" x="0" y="0" font-size="17" fill="#D6E4F0">B.Tech CSE <tspan fill="#5C7A99">(AI &amp; ML)</tspan> &#8212; GPA <tspan fill="#22D3A6">8.47 / 10.0</tspan></text>
    </g>
  </g>

  <!-- corner brackets -->
  <g stroke="#00E5FF" stroke-opacity="0.45" stroke-width="2" fill="none">
    <path d="M18 54 L18 18 L54 18"/>
    <path d="M1182 266 L1182 302 L1146 302"/>
  </g>

  <rect x="1" y="1" width="1198" height="318" rx="18" fill="none" stroke="#1e3350"/>
</g>
</svg>
