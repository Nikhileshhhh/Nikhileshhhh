<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="1200" height="180" role="img" aria-label="Thanks for scrolling">
<defs>
  <linearGradient id="fBg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0e1a2e"/><stop offset="0.5" stop-color="#0b1220"/><stop offset="1" stop-color="#150e24"/>
  </linearGradient>
  <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00E5FF" stop-opacity="0.30"/><stop offset="1" stop-color="#A855F7" stop-opacity="0.30"/>
  </linearGradient>
  <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22D3A6" stop-opacity="0.22"/><stop offset="1" stop-color="#00E5FF" stop-opacity="0.22"/>
  </linearGradient>
  <linearGradient id="fTxt" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="420" y2="0" spreadMethod="reflect">
    <stop offset="0" stop-color="#00E5FF"/><stop offset="0.5" stop-color="#A855F7"/><stop offset="1" stop-color="#22D3A6"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="-420 0" to="0 0" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <clipPath id="fClip"><rect width="1200" height="180" rx="16"/></clipPath>
  <style>
    .mono { font-family: ui-monospace, 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace; }
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
  </style>
</defs>
<g clip-path="url(#fClip)">
  <rect width="1200" height="180" fill="url(#fBg)"/>

  <g fill="url(#w1)">
    <path d="M0 132 C 150 102, 250 162, 400 132 C 550 102, 650 162, 800 132 C 950 102, 1050 162, 1200 132 C 1350 102, 1450 162, 1600 132 L1600 180 L0 180 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-400 0" dur="9s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="url(#w2)">
    <path d="M0 140 C 150 115, 250 168, 400 140 C 550 112, 650 168, 800 140 C 950 112, 1050 168, 1200 140 C 1350 112, 1450 168, 1600 140 L1600 180 L0 180 Z">
      <animateTransform attributeName="transform" type="translate" from="-400 0" to="0 0" dur="12s" repeatCount="indefinite"/>
    </path>
  </g>

  <text class="sans" x="600" y="50" font-size="26" font-weight="800" text-anchor="middle" fill="url(#fTxt)">Thanks for scrolling this far.</text>
  <text class="mono" x="600" y="78" font-size="13.5" text-anchor="middle" fill="#8B97A8">Now let&#8217;s build something worth scrolling through.</text>
  <text class="mono" x="600" y="102" font-size="12" text-anchor="middle" fill="#6B7F96">kamalapurkarnikhilesh@gmail.com &#160;&#183;&#160; linkedin.com/in/nikhileshkamalapurkar &#160;&#183;&#160; Hyderabad, India</text>

  <g fill="#CFF6FF">
    <circle cx="140" cy="40" r="1.6"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="52" r="1.4"><animate attributeName="opacity" values="0.9;0.15;0.9" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="28" r="1.2"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="34" r="1.5"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="4.2s" repeatCount="indefinite"/></circle>
  </g>
  <rect x="1" y="1" width="1198" height="178" rx="16" fill="none" stroke="#1e3350"/>
</g>
</svg>
